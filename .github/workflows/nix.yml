# Build flake packages on nixbuild.net via the marketplace CI workflow, then push
# successful outputs to Cachix on master.
#
# Auth:
#   GitHub secret NIXBUILD_TOKEN (passed to nixbuild-action as nixbuild_token)
#   GitHub secret CACHIX_AUTH_TOKEN (master push job), or OPENBAO_TOKEN/BAO_TOKEN
#   that can read secret/data/ai-api-keys
name: Nix

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    uses: nixbuild/nixbuild-action/.github/workflows/ci-workflow.yml@v26
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
    with:
      # Ladybird flake defines packages (not checks). Match prior matrix: linux
      # packages only, skip default/update aliases.
      filter_builds: '.top_attr == "packages" and .attr != "default" and .attr != "update" and .system == "x86_64-linux"'
      label_builds: '".#\(.attr)"'
      nix_conf: |
        accept-flake-config = true
      fail_fast: false

  push-cachix:
    name: Push to Cachix
    needs: nix
    if: github.ref == 'refs/heads/master' && needs.nix.outputs.success == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Load Cachix token (GitHub secret or OpenBao ai-api-keys)
        id: tokens
        env:
          CACHIX_AUTH_TOKEN_SECRET: ${{ secrets.CACHIX_AUTH_TOKEN }}
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN || secrets.BAO_TOKEN || secrets.VAULT_TOKEN }}
          BAO_ADDR: ${{ secrets.BAO_ADDR || secrets.OPENBAO_ADDR || secrets.VAULT_ADDR || 'https://openbao.boxd.sh' }}
        run: |
          set -euo pipefail
          cachix_token="${CACHIX_AUTH_TOKEN_SECRET:-}"

          if [ -z "$cachix_token" ] && [ -n "${OPENBAO_TOKEN:-}" ]; then
            addr="${BAO_ADDR%/}"
            echo "Fetching CACHIX_AUTH_TOKEN from OpenBao ${addr} (secret/data/ai-api-keys)"
            json="$(curl -fsS -H "X-Vault-Token: ${OPENBAO_TOKEN}" "${addr}/v1/secret/data/ai-api-keys")"
            cachix_token="$(jq -r '.data.data.CACHIX_AUTH_TOKEN // empty' <<<"$json")"
          fi

          if [ -z "$cachix_token" ]; then
            echo "::error::CACHIX_AUTH_TOKEN is not set (GitHub secret or OpenBao ai-api-keys)."
            exit 1
          fi

          echo "::add-mask::${cachix_token}"
          {
            echo "cachix_auth_token<<EOF"
            echo "${cachix_token}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: nixbuild/nixbuild-action@v26
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: codegod100
          authToken: ${{ steps.tokens.outputs.cachix_auth_token }}

      - name: Copy build outputs from nixbuild.net and push to Cachix
        env:
          BUILD_RESULTS: ${{ needs.nix.outputs.results }}
        run: |
          set -euo pipefail
          mapfile -t paths < <(
            jq -r '
              [.. | objects | select(.success == true and .outputs?) | .outputs | to_entries[].value]
              | unique
              | .[]
            ' <<<"$BUILD_RESULTS"
          )
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "error: no successful build outputs to push" >&2
            exit 1
          fi
          echo "Pushing ${#paths[@]} store paths to Cachix"
          nix copy --from ssh-ng://nixbuild --to auto "${paths[@]}"
          cachix push codegod100 "${paths[@]}"

  # Single status gate for branch rules / auto-merge ("CI success").
  ci-success:
    name: Nix success
    needs: [nix, push-cachix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require nix builds (and Cachix push on master)
        run: |
          set -euo pipefail
          echo "nix=${{ needs.nix.result }} push-cachix=${{ needs.push-cachix.result }}"
          test "${{ needs.nix.result }}" = "success"
          if [ "${{ github.ref }}" = "refs/heads/master" ] && [ "${{ needs.nix.result }}" = "success" ]; then
            test "${{ needs.push-cachix.result }}" = "success"
          else
            test "${{ needs.push-cachix.result }}" = "skipped"
          fi
